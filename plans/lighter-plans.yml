model: >-
  Lighter charges no subscription for API access. Account "tiers" are trading-execution tiers that
  set maker/taker fees, latency and rate limits. Tier is tied to the L1 address and switched with
  the changeAccountTier operation (requires no open orders or positions, and at most one change per
  24 hours).
