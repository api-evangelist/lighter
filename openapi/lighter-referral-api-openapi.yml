openapi: 3.2.0
info:
  title: Lighter Referral API
  version: ''
servers:
- url: https://mainnet.zklighter.elliot.ai/
tags:
- name: Referral
paths:
  /api/v1/referral/create:
    post:
      summary: referral_create
      operationId: referral_create
      tags:
      - Referral
      description: Create referral code
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReqCreateReferralCode'
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferralCode'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultCode'
  /api/v1/referral/get:
    get:
      summary: referral_get
      operationId: referral_get
      tags:
      - Referral
      description: Get referral code
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          type: string
      - name: account_index
        in: query
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferralCode'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultCode'
  /api/v1/referral/kickback/update:
    post:
      summary: referral_kickback_update
      operationId: referral_kickback_update
      tags:
      - Referral
      description: Update kickback percentage for referral rewards (allowed once per day)
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReqUpdateKickback'
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespUpdateKickback'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultCode'
  /api/v1/referral/update:
    post:
      summary: referral_update
      operationId: referral_update
      tags:
      - Referral
      description: Update referral code (allowed once per account)
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReqUpdateReferralCode'
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespUpdateReferralCode'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultCode'
  /api/v1/referral/use:
    post:
      summary: referral_use
      operationId: referral_use
      tags:
      - Referral
      description: Use a referral code. You can change this at a later time.
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReqUseReferralCode'
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultCode'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultCode'
  /api/v1/referral/stats:
    get:
      summary: referral_stats
      operationId: referral_stats
      tags:
      - Referral
      description: Get trade stats summed across a referrer's referred users
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          type: string
      - name: auth
        in: query
        required: false
        schema:
          type: string
      - name: l1_address
        in: query
        required: true
        schema:
          type: string
      - name: is_eligible
        in: query
        required: false
        schema:
          type: boolean
          format: boolean
          default: 'false'
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferralStats'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultCode'
components:
  schemas:
    ResultCode:
      type: object
      properties:
        code:
          type: integer
          format: int32
          example: '200'
        message:
          type: string
      title: ResultCode
      required:
      - code
    ReqCreateReferralCode:
      type: object
      properties:
        account_index:
          type: integer
          format: int64
      title: ReqCreateReferralCode
      required:
      - account_index
    ReferralStats:
      type: object
      properties:
        code:
          type: integer
          format: int32
          example: '200'
        message:
          type: string
        stats:
          type: array
          items:
            $ref: '#/components/schemas/ReferralStat'
      title: ReferralStats
      required:
      - code
      - stats
    RespUpdateReferralCode:
      type: object
      properties:
        code:
          type: integer
          format: int32
          example: '200'
        message:
          type: string
        success:
          type: boolean
          format: boolean
          example: 'true'
      title: RespUpdateReferralCode
      required:
      - code
      - success
    ReqUpdateReferralCode:
      type: object
      properties:
        account_index:
          type: integer
          format: int64
        new_referral_code:
          type: string
      title: ReqUpdateReferralCode
      required:
      - account_index
      - new_referral_code
    ReqUpdateKickback:
      type: object
      properties:
        account_index:
          type: integer
          format: int64
        kickback_percentage:
          type: number
          format: double
          maximum: 100
      title: ReqUpdateKickback
      required:
      - account_index
      - kickback_percentage
    ReferralCode:
      type: object
      properties:
        code:
          type: integer
          format: int32
          example: '200'
        message:
          type: string
        referral_code:
          type: string
          example: 5V24K3MJ
      title: ReferralCode
      required:
      - code
      - referral_code
    ReqUseReferralCode:
      type: object
      properties:
        l1_address:
          type: string
        referral_code:
          type: string
        discord:
          type: string
        telegram:
          type: string
        x:
          type: string
        signature:
          type: string
        source:
          type: string
      title: ReqUseReferralCode
      required:
      - l1_address
      - referral_code
    ReferralStat:
      type: object
      properties:
        start_timestamp:
          type: integer
          format: int64
        end_timestamp:
          type: integer
          format: int64
        trade_stats:
          $ref: '#/components/schemas/TradeStats'
      title: ReferralStat
      required:
      - start_timestamp
      - end_timestamp
      - trade_stats
    RespUpdateKickback:
      type: object
      properties:
        code:
          type: integer
          format: int32
          example: '200'
        message:
          type: string
        success:
          type: boolean
          format: boolean
          example: 'true'
      title: RespUpdateKickback
      required:
      - code
      - success
    TradeStats:
      type: object
      properties:
        count:
          type: integer
          format: int64
        volume:
          type: string
        web_count:
          type: integer
          format: int64
        web_volume:
          type: string
        mobile_app_count:
          type: integer
          format: int64
        mobile_app_volume:
          type: string
        mobile_browser_count:
          type: integer
          format: int64
        mobile_browser_volume:
          type: string
        maker_fees_paid:
          type: string
        non_free_taker_volume:
          type: string
        non_free_maker_volume:
          type: string
        free_taker_volume:
          type: string
        taker_fees_paid:
          type: string
        free_maker_volume:
          type: string
      title: TradeStats
      required:
      - count
      - volume
      - web_count
      - web_volume
      - mobile_app_count
      - mobile_app_volume
      - mobile_browser_count
      - mobile_browser_volume
      - free_maker_volume
      - free_taker_volume
      - non_free_maker_volume
      - non_free_taker_volume
      - maker_fees_paid
      - taker_fees_paid
