openapi: 3.2.0
info:
  title: Lighter Info API
  version: ''
servers:
- url: https://mainnet.zklighter.elliot.ai/
tags:
- name: Info
paths:
  /api/v1/transferFeeInfo:
    get:
      summary: transferFeeInfo
      operationId: transferFeeInfo
      tags:
      - Info
      description: Transfer fee info
      parameters:
      - name: authorization
        in: header
        required: true
        schema:
          type: string
      - name: account_index
        in: query
        required: true
        schema:
          type: integer
          format: int64
      - name: to_account_index
        in: query
        required: false
        schema:
          type: integer
          format: int64
          default: '-1'
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferFeeInfo'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultCode'
  /api/v1/withdrawalDelay:
    get:
      summary: withdrawalDelay
      operationId: withdrawalDelay
      tags:
      - Info
      description: Withdrawal delay in seconds
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespWithdrawalDelay'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultCode'
  /api/v1/layer1BasicInfo:
    get:
      summary: layer1BasicInfo
      operationId: layer1BasicInfo
      tags:
      - Info
      description: Get zklighter l1 general info, including contract address and rpc info
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Layer1BasicInfo'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultCode'
  /api/v1/systemConfig:
    get:
      summary: systemConfig
      operationId: systemConfig
      tags:
      - Info
      description: Get system config
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemConfig'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultCode'
  /api/v1/syntheticSpotInfo:
    get:
      summary: syntheticSpotInfo
      operationId: syntheticSpotInfo
      tags:
      - Info
      description: 'Get synthetic spot info for a symbol. For complete details see: https://docs.lighter.xyz/trading/real-world-assets-rwas/us-equity-indices'
      parameters:
      - name: symbol
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespSyntheticSpotInfo'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultCode'
  /api/v1/priceOracleInfo:
    get:
      summary: priceOracleInfo
      operationId: priceOracleInfo
      tags:
      - Info
      description: Get price oracle info (source in use, median exchanges, price cap) for all markets or a single symbol
      parameters:
      - name: symbol
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespPriceOracleInfo'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultCode'
components:
  schemas:
    ResultCode:
      type: object
      properties:
        code:
          type: integer
          format: int32
          example: '200'
        message:
          type: string
      title: ResultCode
      required:
      - code
    RespPriceOracleInfo:
      type: object
      properties:
        code:
          type: integer
          format: int32
          example: '200'
        message:
          type: string
        computed_at_ms:
          type: integer
          format: int64
        markets:
          type: array
          items:
            $ref: '#/components/schemas/PriceOracleMarket'
      title: RespPriceOracleInfo
      required:
      - code
      - computed_at_ms
      - markets
    RespWithdrawalDelay:
      type: object
      properties:
        seconds:
          type: integer
          format: int64
          example: '86400'
      title: RespWithdrawalDelay
      required:
      - seconds
    PriceOraclePrice:
      type: object
      properties:
        source:
          type: string
        using_median:
          type: boolean
          format: boolean
        using_internal_price:
          type: boolean
          format: boolean
        median_sources:
          type: array
          items:
            type: string
        price_cap_bps:
          type: number
          format: double
        price_cap_reference_price:
          type: number
          format: double
          description: ' cap bounds: ref * (1 -/+ bps / 10000)'
      title: PriceOraclePrice
      required:
      - source
      - using_median
      - using_internal_price
      - median_sources
      - price_cap_bps
      - price_cap_reference_price
    TransferFeeInfo:
      type: object
      properties:
        code:
          type: integer
          format: int32
          example: '200'
        message:
          type: string
        transfer_fee_usdc:
          type: integer
          format: int64
      title: TransferFeeInfo
      required:
      - code
      - transfer_fee_usdc
    ValidatorInfo:
      type: object
      properties:
        address:
          type: string
          example: '0x70997970C51812dc3A010C7d01b50e0d17dc79C8'
        is_active:
          type: boolean
          format: boolean
          example: 'true'
      title: ValidatorInfo
      required:
      - address
      - is_active
    PriceOracleMarket:
      type: object
      properties:
        symbol:
          type: string
        index:
          $ref: '#/components/schemas/PriceOraclePrice'
        mark:
          $ref: '#/components/schemas/PriceOraclePrice'
      title: PriceOracleMarket
      required:
      - symbol
      - index
      - mark
    RespSyntheticSpotInfo:
      type: object
      properties:
        code:
          type: integer
          format: int32
          example: '200'
        message:
          type: string
        bps_per_day:
          type: number
          format: double
        expiry_time_ms:
          type: integer
          format: int64
        spot_close_ms:
          type: integer
          format: int64
        source:
          type: string
        symbol:
          type: string
      title: RespSyntheticSpotInfo
      required:
      - code
      - bps_per_day
      - expiry_time_ms
      - spot_close_ms
      - source
      - symbol
    L1ProviderInfo:
      type: object
      properties:
        chainId:
          type: integer
          format: int64
          example: '1'
        networkId:
          type: integer
          format: int64
          example: '1'
        latestBlockNumber:
          type: integer
          format: int64
          example: '45434'
      title: L1ProviderInfo
      required:
      - chainId
      - networkId
      - latestBlockNumber
    ContractAddress:
      type: object
      properties:
        name:
          type: string
          example: '1'
        address:
          type: string
          example: '0x70997970C51812dc3A010C7d01b50e0d17dc79C8'
      title: ContractAddress
      required:
      - name
      - address
    SystemConfig:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        liquidity_pool_index:
          type: integer
          format: int64
        staking_pool_index:
          type: integer
          format: int64
        funding_fee_rebate_account_index:
          type: integer
          format: int64
        liquidity_pool_cooldown_period:
          type: integer
          format: int64
        staking_pool_lockup_period:
          type: integer
          format: int64
        max_integrator_perps_maker_fee:
          type: integer
          format: int32
        max_integrator_perps_taker_fee:
          type: integer
          format: int32
        max_integrator_spot_maker_fee:
          type: integer
          format: int32
        max_integrator_spot_taker_fee:
          type: integer
          format: int32
        market_maker_incentive_account_index:
          type: integer
          format: int64
          example: '3'
        fee_collector_account_index:
          type: integer
          format: int64
          example: '4'
      required:
      - code
      - liquidity_pool_index
      - staking_pool_index
      - funding_fee_rebate_account_index
      - fee_collector_account_index
      - liquidity_pool_cooldown_period
      - staking_pool_lockup_period
      - max_integrator_spot_taker_fee
      - max_integrator_spot_maker_fee
      - max_integrator_perps_taker_fee
      - max_integrator_perps_maker_fee
    Layer1BasicInfo:
      type: object
      properties:
        code:
          type: integer
          format: int32
          example: '200'
        message:
          type: string
        l1_providers:
          type: array
          items:
            $ref: '#/components/schemas/L1ProviderInfo'
        l1_providers_health:
          type: boolean
          format: boolean
          example: 'true'
        validator_info:
          type: array
          items:
            $ref: '#/components/schemas/ValidatorInfo'
        contract_addresses:
          type: array
          items:
            $ref: '#/components/schemas/ContractAddress'
        latest_l1_generic_block:
          type: integer
          format: int64
          example: '45434'
        latest_l1_governance_block:
          type: integer
          format: int64
          example: '45434'
        latest_l1_desert_block:
          type: integer
          format: int64
          example: '45434'
      title: Layer1BasicInfo
      required:
      - code
      - l1_providers
      - l1_providers_health
      - validator_info
      - contract_addresses
      - latest_l1_generic_block
      - latest_l1_governance_block
      - latest_l1_desert_block
