openapi: 3.2.0
info:
  title: Lighter Notification API
  version: "1.0"
servers:
- url: https://mainnet.zklighter.elliot.ai/
tags:
- name: Notification
paths:
  /api/v1/notification/ack:
    post:
      summary: notification_ack
      operationId: notification_ack
      tags:
      - Notification
      description: Ack notification
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReqAckNotif'
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultCode'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultCode'
components:
  schemas:
    ResultCode:
      type: object
      properties:
        code:
          type: integer
          format: int32
          example: '200'
        message:
          type: string
      title: ResultCode
      required:
      - code
    ReqAckNotif:
      type: object
      properties:
        notif_id:
          type: string
          example: '''liq:17:5898'''
        account_index:
          type: integer
          format: int64
      title: ReqAckNotif
      required:
      - notif_id
      - account_index
