openapi: 3.2.0
info:
  title: Lighter Funding API
  version: ''
servers:
- url: https://mainnet.zklighter.elliot.ai
tags:
- name: Funding
paths:
  /api/v1/funding-rates:
    get:
      summary: funding-rates
      operationId: funding-rates
      tags:
      - Funding
      description: Get funding rates
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FundingRates'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultCode'
components:
  schemas:
    ResultCode:
      type: object
      properties:
        code:
          type: integer
          format: int32
          example: '200'
        message:
          type: string
      title: ResultCode
      required:
      - code
    FundingRates:
      type: object
      properties:
        code:
          type: integer
          format: int32
          example: '200'
        message:
          type: string
        funding_rates:
          type: array
          items:
            $ref: '#/components/schemas/FundingRate'
      title: FundingRates
      required:
      - code
      - funding_rates
    FundingRate:
      type: object
      properties:
        market_id:
          type: integer
          format: int16
        exchange:
          type: string
          enum:
          - binance
          - bybit
          - hyperliquid
          - lighter
        symbol:
          type: string
        rate:
          type: number
          format: double
      title: FundingRate
      required:
      - market_id
      - exchange
      - symbol
      - rate
  securitySchemes:
    apiKey:
      type: apiKey
      description: Enter JWT Bearer token **_only_**
      name: Authorization
      in: header
