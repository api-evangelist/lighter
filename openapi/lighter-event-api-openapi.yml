openapi: 3.2.0
info:
  title: Lighter Event API
  version: "1.0"
servers:
- url: https://mainnet.zklighter.elliot.ai/
tags:
- name: Event
paths:
  /api/v1/events:
    get:
      summary: events
      operationId: events
      tags:
      - Event
      description: Get events and registered order books, including scheduled events with no books. event_ids and market_ids accept up to 50 comma-separated positive IDs, are mutually exclusive, and use the same filters, sorting and pagination. market_ids returns each related event once with all its order books. Defaults to descending id. start_at sorting uses (start_at, event_id); cursor identifies an existing event and excludes it in the requested direction. tag filters across creators; creator_account_index is an optional additional filter. active=true requires a tradeable outcome; active=false includes scheduled and closed events.
      parameters:
      - name: event_ids
        in: query
        description: ' comma-separated positive IDs, max 50'
        required: false
        schema:
          type: string
      - name: market_ids
        in: query
        description: ' comma-separated positive IDs, max 50'
        required: false
        schema:
          type: string
      - name: creator_account_index
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: cursor
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: active
        in: query
        description: ' true: at least one outcome still tradeable; false: none'
        required: false
        schema:
          type: boolean
          format: boolean
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int64
          minimum: 1
          maximum: 100
      - name: tag
        in: query
        description: ' series tag; creator filter is optional'
        required: false
        schema:
          type: string
      - name: event_kind
        in: query
        required: false
        schema:
          type: string
          enum:
          - one_off
          - recurrent
      - name: start_from
        in: query
        description: ' inclusive start_at, Unix milliseconds'
        required: false
        schema:
          type: integer
          format: int64
      - name: start_before
        in: query
        description: ' exclusive start_at, Unix milliseconds'
        required: false
        schema:
          type: integer
          format: int64
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
          - id
          - start_at
          default: id
      - name: order
        in: query
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespGetEvents'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultCode'
components:
  schemas:
    EventDetail:
      type: object
      properties:
        event_id:
          type: integer
          format: int64
          example: '1'
        title:
          type: string
        description:
          type: string
        creator_account_index:
          type: integer
          format: int64
          example: '1'
        created_at:
          type: integer
          format: int64
          example: '1640995200000'
        tag:
          type: string
        event_kind:
          type: string
          enum:
          - one_off
          - recurrent
        recurrence_period_seconds:
          type: integer
          format: int32
        start_at:
          type: integer
          format: int64
        end_at:
          type: integer
          format: int64
        metadata:
          type: object
          additionalProperties: true
        order_books:
          type: array
          items:
            $ref: '#/components/schemas/EventOrderBookEntry'
        lifetime_quote_token_volume:
          type: number
          format: double
          example: '8400000.00'
      title: EventDetail
      required:
      - event_id
      - title
      - description
      - creator_account_index
      - created_at
      - tag
      - event_kind
      - recurrence_period_seconds
      - start_at
      - end_at
      - metadata
      - order_books
      - lifetime_quote_token_volume
    BinaryOptionMarketStats:
      type: object
      properties:
        symbol:
          type: string
          example: BINOPT1000
        market_id:
          type: integer
          format: int64
          example: '1000'
        mid_price:
          type: string
          example: '0.52'
        best_ask_price:
          type: string
          example: '0.53'
        best_bid_price:
          type: string
          example: '0.51'
        last_trade_price:
          type: string
          example: '0.52'
        daily_base_token_volume:
          type: number
          format: double
          example: '235.25'
        daily_quote_token_volume:
          type: number
          format: double
          example: '115.27'
        daily_price_low:
          type: number
          format: double
          example: '0.42'
        daily_price_high:
          type: number
          format: double
          example: '0.55'
        daily_price_change:
          type: number
          format: double
          example: '0.03'
        lifetime_quote_token_volume:
          type: number
          format: double
          example: '8400000.00'
        lifetime_base_token_volume:
          type: number
          format: double
          example: '16000000.00'
          description: ' outcome shares traded over the market''s life'
        open_interest:
          type: string
          example: '93.0'
        status:
          type: string
          enum:
          - inactive
          - active
          - waiting-for-settlement
          - in-settlement
          - settled
          description: ' inactive before the trading window opens, waiting-for-settlement once it closes'
        outcome:
          type: integer
          format: int32
          enum:
          - 0
          - 1
          - 2
          x-enum-varnames:
          - None
          - 'No'
          - 'Yes'
      title: BinaryOptionMarketStats
      required:
      - symbol
      - market_id
      - mid_price
      - best_ask_price
      - best_bid_price
      - last_trade_price
      - daily_base_token_volume
      - daily_quote_token_volume
      - daily_price_low
      - daily_price_high
      - daily_price_change
      - lifetime_quote_token_volume
      - lifetime_base_token_volume
      - open_interest
      - status
      - outcome
    EventOrderBookEntry:
      type: object
      properties:
        symbol:
          type: string
          example: ETH
        market_id:
          type: integer
          format: int64
          example: '1'
        market_type:
          type: string
          enum:
          - perp
          - spot
          - binary_options
        base_asset_id:
          type: integer
          format: int16
          example: '1'
        quote_asset_id:
          type: integer
          format: int16
          example: '2'
        status:
          type: string
          enum:
          - inactive
          - active
          - in-settlement
          - waiting-for-settlement
          - settled
          description: ' waiting-for-settlement and settled are binary options only'
        taker_fee:
          type: string
          example: '0.0001'
        is_taker_fee_enabled:
          type: boolean
          format: boolean
          example: 'true'
        maker_fee:
          type: string
          example: '0.0000'
        is_maker_fee_enabled:
          type: boolean
          format: boolean
          example: 'true'
        liquidation_fee:
          type: string
          example: '0.01'
        min_base_amount:
          type: string
          example: '0.01'
        min_quote_amount:
          type: string
          example: '0.1'
        order_quote_limit:
          type: string
          example: '235.25'
        supported_size_decimals:
          type: integer
          format: uint8
          example: '4'
        supported_price_decimals:
          type: integer
          format: uint8
          example: '4'
        supported_quote_decimals:
          type: integer
          format: uint8
          example: '4'
        created_at:
          type: string
          example: '1640995200000'
        multiplier:
          type: string
          example: '1.000000000000000000'
        start_timestamp:
          type: integer
          format: int64
          example: '1640995200000'
        end_timestamp:
          type: integer
          format: int64
          example: '1640995200000'
        open_interest:
          type: string
          example: '93.0'
        outcome:
          type: integer
          format: int32
          enum:
          - 0
          - 1
          - 2
          x-enum-varnames:
          - None
          - 'No'
          - 'Yes'
        operator_account_index:
          type: integer
          format: int64
          example: '1'
        settlement_cap:
          type: integer
          format: int32
          example: '10000'
        settlement_type:
          type: integer
          format: int32
          enum:
          - 0
          - 1
          x-enum-varnames:
          - Discrete
          - Continuous
        settlement_price:
          type: integer
          format: int32
          example: '10000'
        default_price:
          type: integer
          format: int32
          example: '5000'
        is_frozen:
          type: boolean
          format: boolean
          example: 'false'
        size_decimals:
          type: integer
          format: uint8
          example: '4'
        price_decimals:
          type: integer
          format: uint8
          example: '4'
        stats:
          $ref: '#/components/schemas/BinaryOptionMarketStats'
      title: EventOrderBookEntry
      required:
      - symbol
      - market_id
      - market_type
      - base_asset_id
      - quote_asset_id
      - status
      - taker_fee
      - is_taker_fee_enabled
      - maker_fee
      - is_maker_fee_enabled
      - liquidation_fee
      - min_base_amount
      - min_quote_amount
      - order_quote_limit
      - supported_size_decimals
      - supported_price_decimals
      - supported_quote_decimals
      - created_at
      - multiplier
      - start_timestamp
      - end_timestamp
      - open_interest
      - outcome
      - operator_account_index
      - settlement_cap
      - settlement_type
      - settlement_price
      - default_price
      - is_frozen
      - size_decimals
      - price_decimals
      - stats
    RespGetEvents:
      type: object
      properties:
        code:
          type: integer
          format: int32
          example: '200'
        message:
          type: string
        next_cursor:
          type: integer
          format: int64
          example: '1'
        events:
          type: array
          items:
            $ref: '#/components/schemas/EventDetail'
      title: RespGetEvents
      required:
      - code
      - events
    ResultCode:
      type: object
      properties:
        code:
          type: integer
          format: int32
          example: '200'
        message:
          type: string
      title: ResultCode
      required:
      - code
