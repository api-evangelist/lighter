aid: lighter
name: Lighter
description: >-
  Lighter is a decentralized perpetual futures exchange built on zkLighter, a zero-knowledge rollup
  that produces verifiable proofs of order matching and liquidations while targeting the latency of
  a centralized venue. Traders register a Lighter account by signing with an Ethereum wallet, then
  operate it through up to 256 API keys across master and sub-accounts. The public zkLighter REST
  API exposes 78 operations covering order books, trades, candles, funding rates, accounts,
  positions, public pools, referrals, deposits, transfers and withdrawals, alongside a WebSocket
  stream carrying order book, trade, candle, position and account-transaction channels. Writes are
  signed transactions rather than plain authenticated calls: clients sign an order, cancel, modify
  or transfer body with an API private key and submit it via sendTx or sendTxBatch. Lighter ships
  first-party Python and Go SDKs, runs a full testnet deployment, publishes a 239-entry numeric
  error registry, weighted per-tier rate limits, and a vulnerability disclosure policy.
